name: Build OpenWrt E8820v2 from Prebuilt Source
on:
  workflow_dispatch:

env:
  RELEASE_URL: "https://github.com/siwind/openwrt/releases/download/v19.07.7/openwrt-19.07.7.tar.gz"
  FIRMWARE_NAME: "ZTE-E8820V2"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y build-essential clang gcc g++ bash gawk git \
          libncurses-dev libssl-dev python2 python2-dev python3 unzip \
          wget file rsync subversion flex bison zip curl zlib1g-dev \
          tar xz-utils
        ln -sf /usr/bin/python2 /usr/bin/python
        mkdir -p /workdir

    - name: Download and extract prebuilt source
      working-directory: /workdir
      run: |
        echo "Downloading OpenWrt source from release..."
        wget -O openwrt-source.tar.gz $RELEASE_URL
        
        echo "Extracting source code..."
        tar -xzf openwrt-source.tar.gz
        mv openwrt-19.07.7 openwrt
        rm -f openwrt-source.tar.gz
        
        echo "Source code ready:"
        ls -la openwrt/

    - name: Verify ZTE E8820V2 support
      working-directory: /workdir/openwrt
      run: |
        echo "=== Checking ZTE E8820V2 support ==="
        
        # Cek device dalam target
        if [ -f "target/linux/ramips/image/mt7621.mk" ]; then
          echo "✓ mt7621.mk found"
          grep -n "E8820" target/linux/ramips/image/mt7621.mk || echo "⚠ E8820 not found in mt7621.mk"
        else
          echo "✗ mt7621.mk not found"
        fi
        
        # Cek DTS file
        if [ -f "target/linux/ramips/dts/E8820V2.dts" ]; then
          echo "✓ E8820V2.dts found"
        else
          echo "✗ E8820V2.dts not found, checking for other E8820 files..."
          find target/linux/ramips/dts/ -name "*e8820*" -o -name "*8820*" | head -10
        fi
        
        # Cek board configuration
        if [ -d "target/linux/ramips/base-files/etc/board.d" ]; then
          echo "✓ board.d directory found"
          grep -r "E8820" target/linux/ramips/base-files/etc/board.d/ || echo "⚠ E8820 not found in board.d"
        fi

    - name: Setup feeds and configuration
      working-directory: /workdir/openwrt
      run: |
        # Update feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Gunakan default config untuk E8820V2
        echo "=== Generating default config ==="
        make defconfig
        
        # Pastikan target device terpilih
        echo "CONFIG_TARGET_ramips=y" >> .config
        echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
        echo "CONFIG_TARGET_ramips_mt7621_DEVICE_zte_e8820v2=y" >> .config
        
        # Essential packages untuk E8820V2
        echo "CONFIG_PACKAGE_kmod-mt7603=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt76x2=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt7621=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-ohci=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_odhcpd=y" >> .config
        echo "CONFIG_PACKAGE_odhcp6c=y" >> .config
        echo "CONFIG_PACKAGE_firewall=y" >> .config
        echo "CONFIG_PACKAGE_iptables=y" >> .config
        
        # Filesystem
        echo "CONFIG_PACKAGE_block-mount=y" >> .config
        echo "CONFIG_PACKAGE_fstools=y" >> .config
        
        # Utilities
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_telnet=y" >> .config
        echo "CONFIG_PACKAGE_bash=y" >> .config
        
        # Update config
        make defconfig

    - name: Apply custom patches if needed
      working-directory: /workdir/openwrt
      run: |
        # Cek jika perlu patch tambahan
        if [ ! -f "target/linux/ramips/dts/E8820V2.dts" ]; then
          echo "Applying E8820V2 device tree patch..."
          # Download DTS dari source alternatif jika tidak ada
          wget -O target/linux/ramips/dts/E8820V2.dts \
            https://raw.githubusercontent.com/Z-Prion/wr720n-710n-700n-lede-file/master/E8820v2-19.07/E8820V2.dts || echo "DTS download failed, continuing without it"
        fi
        
        # Verifikasi final config
        echo "=== Final configuration check ==="
        grep "CONFIG_TARGET.*DEVICE.*zte_e8820v2" .config && echo "✓ ZTE E8820V2 device selected" || echo "⚠ ZTE E8820V2 device not selected"

    - name: Download packages
      working-directory: /workdir/openwrt
      run: |
        echo "Downloading packages..."
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: /workdir/openwrt
      env:
        FORCE_UNSAFE_CONFIGURE: 1
      run: |
        echo "Starting firmware build..."
        make -j$(nproc) V=s 2>&1 | tee build.log || {
          echo "Build failed, retrying with single thread..."
          make -j1 V=s
        }
        
        # Cek hasil build
        if [ -d "bin/targets" ]; then
          echo "✓ Build completed successfully"
          find bin/targets/ -name "*.bin" -o -name "*.img" | head -10
        else
          echo "✗ Build failed - no target directory found"
          exit 1
        fi

    - name: Extract ZTE E8820V2 firmware
      id: extract_firmware
      working-directory: /workdir/openwrt
      run: |
        cd bin/targets/*/*
        
        echo "=== Searching for ZTE E8820V2 firmware ==="
        
        # Pattern untuk ZTE E8820V2
        FIRMWARE_PATTERNS=(
          "*zte*e8820*v2*"
          "*e8820*v2*"
          "*e8820v2*"
          "*8820*v2*"
        )
        
        # Buat directory untuk firmware
        mkdir -p ${FIRMWARE_NAME}
        
        FIRMWARE_COUNT=0
        for pattern in "${FIRMWARE_PATTERNS[@]}"; do
          for file in $pattern; do
            if [ -f "$file" ] && [ ! -d "$file" ]; then
              cp "$file" ${FIRMWARE_NAME}/
              echo "✅ Found: $file"
              FIRMWARE_COUNT=$((FIRMWARE_COUNT+1))
            fi
          done
        done
        
        # Fallback: cari file untuk mt7621
        if [ $FIRMWARE_COUNT -eq 0 ]; then
          echo "No specific E8820V2 firmware found, looking for mt7621 files..."
          find . -maxdepth 1 -name "*mt7621*" -type f | grep -E '\.(bin|img|trx)$' | head -5 | while read file; do
            cp "$file" ${FIRMWARE_NAME}/
            echo "📁 Copied (fallback): $(basename $file)"
            FIRMWARE_COUNT=$((FIRMWARE_COUNT+1))
          done
        fi
        
        # List semua file yang ditemukan
        echo "=== Firmware files found ==="
        ls -la ${FIRMWARE_NAME}/ || echo "No files in firmware directory"
        
        # Set output variables
        echo "FIRMWARE_COUNT=$FIRMWARE_COUNT" >> $GITHUB_ENV
        echo "FIRMWARE_PATH=/workdir/openwrt/bin/targets/*/*/${FIRMWARE_NAME}" >> $GITHUB_ENV
        echo "::set-output name=count::$FIRMWARE_COUNT"

    - name: Upload ZTE E8820V2 firmware artifact
      uses: actions/upload-artifact@v4
      if: env.FIRMWARE_COUNT != 0
      with:
        name: ${{ env.FIRMWARE_NAME }}-${{ github.run_number }}
        path: ${{ env.FIRMWARE_PATH }}/*
        retention-days: 30
        compression-level: 9

    - name: Build summary
      if: always()
      run: |
        echo "=== BUILD SUMMARY ==="
        echo "Device: ZTE E8820V2"
        echo "Source: $RELEASE_URL"
        echo "Firmware files: $FIRMWARE_COUNT"
        echo "Artifact: $FIRMWARE_NAME-${{ github.run_number }}"
        echo "Build date: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "Workflow: ${{ github.workflow }}"
        echo "Run ID: ${{ github.run_id }}"
        
        if [ "$FIRMWARE_COUNT" -eq "0" ]; then
          echo "::warning::No firmware files were generated!"
          echo "Available files in target directory:"
          find /workdir/openwrt/bin/targets/ -name "*.bin" -o -name "*.img" | head -20
        else
          echo "✅ Build and upload completed successfully"
        fi

    - name: Upload build log for debugging
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          /workdir/openwrt/build.log
          /workdir/openwrt/.config
        retention-days: 7
