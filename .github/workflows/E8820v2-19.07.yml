name: Build OpenWrt E8820v2-19.07
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/siwind/openwrt.git
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 1907.config
  DIY_P1_SH: diy-18.06.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        apt-get update
        apt-get install -y \
          build-essential \
          clang \
          gcc \
          g++ \
          bash \
          gawk \
          git \
          libncurses-dev \
          libssl-dev \
          python2 \
          python2-dev \
          python3 \
          unzip \
          wget \
          file \
          rsync \
          subversion \
          flex \
          bison \
          zip \
          curl \
          zlib1g-dev
        ln -sf /usr/bin/python2 /usr/bin/python
        mkdir -p /workdir
        chown $USER:$GROUPS /workdir
        
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        CONFIG_URL="https://raw.githubusercontent.com/siwind/openwrt/refs/heads/openwrt-19.07/user-config/config-zte-e8820v2"
        wget -q --show-progress -O openwrt/.config $CONFIG_URL
          
    - name: Download package
      id: package
      if: (github.event.inputs.ssh == 'false')
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile the firmware
      id: compile
      if: (github.event.inputs.ssh == 'false')
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        export FORCE_UNSAFE_CONFIGURE=1
        make -j1 V=s
        echo "======================="
        df -h
        echo "======================="
        du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
        du -h --max-depth=1 ./build_dir
        du -h --max-depth=1 ./bin
          
    - name: Prepare artifact
      run: |
        mkdir -p ./artifact/package
        mkdir -p ./artifact/buildinfo
        cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/
        cp -rf $(find ./bin/targets/ -type f -name "*.ipk") ./artifact/package/
        cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/

    - name: Upload buildinfo
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_buildinfo
        path: ./artifact/buildinfo/

    - name: Upload package
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_package
        path: ./artifact/package/

    - name: Upload firmware
      uses: actions/upload-artifact@main
      with:
        name: OpenWrt_firmware
        path: ./bin/targets/
